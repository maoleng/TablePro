name: Windows preview build

on:
  push:
    branches: [windows-preview-build]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build unpackaged Windows x64 app
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CORE_DIRECTORY: target/x86_64-pc-windows-msvc/debug
      CORE_INPUT_PATHS: >-
        .cargo core Cargo.toml Cargo.lock rust-toolchain.toml linux/crates/platform
        windows/Directory.Build.props windows/src/TablePro.Interop/TablePro.Interop.csproj
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Hash the Rust build inputs
        id: core-inputs
        run: |
          $paths = $env:CORE_INPUT_PATHS -split '\s+'
          $sources = (git ls-tree HEAD -- @paths) -join "`n"
          if ($LASTEXITCODE -ne 0 -or -not $sources) { throw 'Could not read the Rust build inputs' }
          $compiler = (rustc -vV) -join "`n"
          if ($LASTEXITCODE -ne 0 -or -not $compiler) { throw 'Could not identify the Rust compiler' }
          $settings = "win-x64/dev $env:CARGO_PROFILE_DEV_DEBUG $env:AWS_LC_SYS_PREBUILT_NASM $env:RUSTFLAGS"
          $bytes = [Text.Encoding]::UTF8.GetBytes("$sources`n$compiler`n$settings")
          $sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "key=tablepro-core-v1-$sha" >> $env:GITHUB_OUTPUT

      - name: Restore the compiled Rust core
        id: core-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/x86_64-pc-windows-msvc/debug/tablepro_ffi.dll
            target/x86_64-pc-windows-msvc/debug/tablepro-cli.exe
          key: ${{ steps.core-inputs.outputs.key }}

      # The first preview was built before this cache existed.
      - name: Check the first preview's Rust inputs
        if: steps.core-cache.outputs.cache-hit != 'true' && github.repository == 'maoleng/TablePro'
        id: seed-inputs
        run: |
          $paths = $env:CORE_INPUT_PATHS -split '\s+'
          $compiler = rustc --version
          if ($LASTEXITCODE -ne 0 -or $compiler -notlike 'rustc 1.98.1 (48a229cea *' -or
              $env:CARGO_PROFILE_DEV_DEBUG -ne '0' -or $env:AWS_LC_SYS_PREBUILT_NASM -ne '1' -or $env:RUSTFLAGS) {
            return
          }
          $source = '26f0b05d5f1ed3cec51fa79f526d263d531b1028'
          git fetch --no-tags --depth=1 origin $source
          if ($LASTEXITCODE -ne 0) { return }
          git diff --quiet $source HEAD -- @paths
          if ($LASTEXITCODE -eq 0) { 'matches=true' >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Download the first preview
        if: steps.seed-inputs.outputs.matches == 'true'
        id: seed-artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tablepro-windows-preview-x64
          path: ${{ runner.temp }}/tablepro-core-seed
          github-token: ${{ github.token }}
          run-id: 45480589233

      - name: Verify and reuse the first preview's Rust binaries
        if: steps.seed-artifact.outcome == 'success'
        run: |
          $seed = Join-Path $env:RUNNER_TEMP 'tablepro-core-seed'
          $info = Get-Content -LiteralPath (Join-Path $seed 'build-info.json') -Raw | ConvertFrom-Json
          if ($info.source -ne $env:GITHUB_REPOSITORY -or $info.platform -ne 'win-x64' -or
              $info.commit -ne '26f0b05d5f1ed3cec51fa79f526d263d531b1028') {
            throw 'The seed artifact does not match the first preview'
          }
          $files = 'tablepro_ffi.dll', 'tablepro-cli.exe'
          foreach ($name in $files) {
            $entry = @($info.files | Where-Object path -eq $name)
            $file = Join-Path $seed $name
            if ($entry.Count -ne 1 -or (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $entry[0].sha256) {
              throw "Seed checksum mismatch: $name"
            }
          }
          New-Item -ItemType Directory -Path $env:CORE_DIRECTORY -Force | Out-Null
          foreach ($name in $files) { Copy-Item -LiteralPath (Join-Path $seed $name) -Destination $env:CORE_DIRECTORY }
          Write-Host 'Reused both Rust binaries from the first preview'

      - name: Build the Rust core
        working-directory: windows
        run: |
          $files = 'tablepro_ffi.dll', 'tablepro-cli.exe'
          $core = Join-Path $env:GITHUB_WORKSPACE $env:CORE_DIRECTORY
          $missing = @($files | Where-Object { -not (Test-Path -LiteralPath (Join-Path $core $_) -PathType Leaf) })
          if ($missing.Count -eq 0) {
            Write-Host 'Rust binaries are ready; skipping Cargo'
            return
          }
          dotnet msbuild src/TablePro.Interop/TablePro.Interop.csproj -t:BuildCore -p:RuntimeIdentifier=win-x64 -p:CargoProfile=dev -v:normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in $files) {
            if (-not (Test-Path -LiteralPath (Join-Path $core $name) -PathType Leaf)) {
              throw "The Rust build is missing $name"
            }
          }

      - name: Save the compiled Rust core
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/x86_64-pc-windows-msvc/debug/tablepro_ffi.dll
            target/x86_64-pc-windows-msvc/debug/tablepro-cli.exe
          key: ${{ steps.core-inputs.outputs.key }}

      - name: Publish the app
        working-directory: windows
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'tablepro-win-x64'
          dotnet publish src/TablePro.App -c Release -r win-x64 -p:Platform=x64 -p:CargoProfile=dev -p:SkipCoreBuild=true -o $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in 'TablePro.exe', 'tablepro_ffi.dll', 'tablepro-cli.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $publish $file) -PathType Leaf)) {
              throw "The publish is missing $file"
            }
          }
          if (Test-Path -LiteralPath (Join-Path $publish 'TablePro.dll')) {
            throw 'Expected a Native AOT executable'
          }

      - name: Record source and checksums
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'tablepro-win-x64'
          Copy-Item -LiteralPath LICENSE -Destination $publish
          $files = @(Get-ChildItem -LiteralPath $publish -File -Recurse | ForEach-Object {
            @{
              path = [IO.Path]::GetRelativePath($publish, $_.FullName)
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            }
          })
          @{
            source = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            platform = 'win-x64'
            files = $files
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $publish 'build-info.json')

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tablepro-windows-preview-x64
          path: ${{ runner.temp }}/tablepro-win-x64/
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
